{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h4>Подтверждение email</h4>
                </div>
                <div class="card-body">
                    {% if message %}
                        <div class="alert alert-{{ message_type or 'danger' }}">{{ message }}</div>
                    {% endif %}
                    <p>Мы отправили код подтверждения на <strong>{{ email }}</strong></p>
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Введите код из письма</label>
                            <input type="text" name="code" class="form-control" placeholder="000000" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Подтвердить</button>
                        <a href="/resend_code" class="btn btn-secondary">Отправить код заново</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
