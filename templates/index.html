{% extends "base.html" %}

{% block content %}
    <a href="{{ url_for('register') }}" class="btn btn-secondary">Регистрация</a>
    <a href="{{ url_for('login', next=request.path) }}" class="btn btn-secondary">Вход</a>
    <a href="{{ url_for('home_page') }}" class="btn btn-secondary">Главная страница</a>
    <h1>Что предоставляет наш сайт:</h1>
    <p></p>
    <div class="carousel-container">
        <div id="f_carsel" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src={{ pic_list[0] }} class="d-block w-100">
                </div>
                {% for i in range(pic_list|length) %}
                {% if i > 0 %}
                <div class="carousel-item">
                    <img src={{ pic_list[i] }} class="d-block w-100">
                </div>
                {% endif %}
                {% endfor %}
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#f_carsel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#f_carsel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
