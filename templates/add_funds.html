{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h3>Add Funds</h3>


  <div class="card mt-3">
    <div class="card-body">
      <p class="text-muted">Add funds to your wallet</p>


      <form method="POST" action="/add_funds/confirm">
        <div class="mb-3">
          <label for="amount" class="form-label">Amount</label>
          <input type="number" step="0.01" min="0" id="amount" name="amount" class="form-control" placeholder="0.00" required>
        </div>

        <button type="submit" class="btn btn-primary">Add Funds</button>
        <a href="/balance" class="btn btn-outline-secondary ms-2">Back</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
