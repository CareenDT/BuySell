{% extends "base.html" %}

{% block content %}
<div class="cart-wrapper"
     id="cartPage"
     data-i18n-empty="{{ t('cart.empty') }}"
     data-i18n-remove="{{ t('cart.remove') }}">
    <div class="cart-header">
        <h3>{{ t('cart.title') }}</h3>
    </div>

    <table class="cart-table">
        <thead>
            <tr>
                <th>{{ t('cart.product_id') }}</th>
                <th>{{ t('cart.quantity') }}</th>
                <th>{{ t('cart.action') }}</th>
            </tr>
        </thead>
        <tbody id="cart-body">
            <tr id="empty-cart">
                <td colspan="3">{{ t('cart.empty') }}</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
let cart = [];
const header = document.getElementById("header");
const root = document.getElementById("cartPage");
const i18n = {
    empty: root.dataset.i18nEmpty,
    remove: root.dataset.i18nRemove
};
const source = new EventSource('/cart/stream');

function updateCartDisplay() {
    const tbody = document.getElementById('cart-body');

    if (cart.length == 0) {
        tbody.innerHTML = `
        <tr id="empty-cart">
                <td colspan="3">${i18n.empty}</td>
        </tr>
        `;
        return;
    }

    tbody.innerHTML = cart.map(item => `
        <tr>
            <td>${item.product_id}</td>
            <td>
                <input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${item.product_id}, this.value)" style="width: 80px;">
            </td>
            <td><button type="button" onclick="removeFromCart(${item.product_id})" class="btn btn-sm btn-palette-outline">${i18n.remove}</button></td>
        </tr>
    `).join('');
}

async function updateQuantity(productId, quantity) {
    await fetch('/cart/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({product_id: productId, quantity: parseInt(quantity)})
    });
}

async function removeFromCart(productId) {
    await fetch('/cart/remove', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({product_id: productId})
    });
}

source.onmessage = function(event) {
    const payload = JSON.parse(event.data);
    if (payload.type === "initial") {
        cart = payload.cart || [];
        updateCartDisplay();
        return;
    }
    const data = payload.item;
    if (!data) return;

    if (data.type === "update" || data.type === "add") {
        initialLoad();
        return;
    }
    if (data.type === "remove") {
        cart = cart.filter((val) => val.product_id !== data.product_id);
    }

    updateCartDisplay();
};

source.onerror = function(event) {
    console.warn("SSE error:", event);
};

async function initialLoad() {
    const response = await fetch("/cart/get_contents");

    if (response.ok) {
        let data = await response.json();
        cart = data;
    } else {
        console.error("HTTP: " + response.status);
    }
    updateCartDisplay();
}

initialLoad();
</script>
{% endblock %}
