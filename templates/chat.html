{% extends "base.html" %}

{% block at_head_end %}
<link rel="stylesheet" type="text/css" href="{{ url_for("static", filename="css/chat_style.css") }}">
{% endblock %}

{% block content %}
<div class="chat-wrapper">
    <div class="chat-header">
        <h3>{{ t('chat.title_header') }}</h3>
    </div>
    <ul id="board" class="chat-board"></ul>
    <div class="chat-input-bar">
        <input type="text" id="msgInput" placeholder="{{ t('chat.placeholder') }}" autocomplete="off">
        <button type="button" id="sendBtn" onclick="sendMessage()">{{ t('chat.send') }}</button>
    </div>
</div>

<script>
    const connectErrorText = {{ t('chat.connect_error') | tojson }};
    const board = document.getElementById("board");
    const header = document.getElementById("header");
    const chatId = parseInt("{{ chat_id }}");
    const currentUserId = parseInt("{{ current_user.id }}");

    const warning_msg = document.createElement("div");
    warning_msg.className = "alert alert-danger";
    warning_msg.role = "alert";
    warning_msg.textContent = connectErrorText;
    warning_msg.style.textAlign = "center";

    const eventSource = new EventSource(`/chat/${chatId}/stream`);

    function appendMessage(text, senderId) {
        const wrapper = document.createElement("div");
        const msg = document.createElement("li");
        const side = senderId.toString() === currentUserId.toString() ? "self" : "other";

        wrapper.className = `chat-message-wrapper ${side}`;
        msg.className = `chat-message ${side}`;
        msg.textContent = text;

        wrapper.appendChild(msg);
        board.appendChild(wrapper);
        wrapper.scrollIntoView({ behavior: "smooth" });
    }

    eventSource.onmessage = (event) => {
        let data;
        try {
            data = JSON.parse(event.data);
        } catch (e) {
            return;
        }
        if (data.error || typeof data.text === "undefined") {
            return;
        }

        if (header.contains(warning_msg)) {
            header.removeChild(warning_msg);
        }

        appendMessage(data["text"], data["sender"]);
    };

    eventSource.onerror = () => {
        if (!header.contains(warning_msg)) {
            header.appendChild(warning_msg);
        }
    };

    function sendMessage() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();

        if (!text) return;

        fetch(`/chat/${chatId}/send`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                text: text,
                sender: currentUserId
            })
        });

        input.value = "";
    }
</script>
{% endblock %}
